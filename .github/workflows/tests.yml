name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests (CPU, synthetic data, no API key)
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
          STILLHERE_EMBEDDING_MODEL_DIR: ""

  synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Quickstart on the synthetic Alice / Bob export, then status, memory query and a labelled dry-run chat
        env:
          STILLHERE_PERSONA_ROOT: ${{ runner.temp }}/profiles
          PYTHONIOENCODING: utf-8
        run: |
          stillhere persona quickstart --input examples/synthetic/weflow_demo/alice_bob_weflow.json --speaker contact --non-interactive --json > qs.json
          PID=$(python -c "import json; print(json.load(open('qs.json'))['profile_id'])")
          stillhere persona status --profile "$PID"
          stillhere persona memory-query --profile "$PID" --q "西湖改到几号了？" | grep -q "西湖改到25号"
          stillhere persona chat --profile "$PID" --backend fake --message "你领养的猫叫什么？" | grep -q "ACTIVE_MEMORY_PIPELINE: V2L_P2_FALLBACK"
          stillhere persona memory-build --profile "$PID" --source examples/synthetic/weflow_demo/alice_bob_weflow_update.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Relative links and documented CLI commands
        run: python scripts/check_docs.py
