# FALLBACK ONLY (use if the 8192 smoke OOMs after the documented checks): cutoff 4096, the 899 pilot rows that fit 4096 (rows over 4096 are
# NOT truncated - they are not in this file), 113 steps, candidates 75 / 100 / 113. Different config hash and run id from the 8192 run.
# StillHere D5 pilot: Evidence-Grounded Memory Reasoning Adapter. ONE fresh QLoRA adapter on Qwen3-8B (never initialised from D4),
# 4-bit NF4 double-quant, bf16 compute, ONE Colab A100 40GB (no High-RAM, no 80GB, no multi-GPU).
# Data: d5-pilot-v1 (1,200 train rows; dev 118 rows for eval loss). Reader 1.1 FACT prompt, answer-first JSON target, assistant-only loss.
# Steps: micro-batch 1 (no padding waste) x grad-accum 8 = 8 rows per optimizer step; ceil(1,200 / 8) = 150 steps in 1 epoch.
# Checkpoints and dev eval loss every 25 steps (6 checkpoints, all kept for resume). Pre-registered candidates: steps 75 / 125 / 150
# (~50 / 75 / 100 % of the run, rounded up to a saved step). Selection: d5pilot.evaluate.SELECTION_RULE on the 48-question selection subset
# (generation-based; eval loss never selects). The 4096 fallback is a DIFFERENT config / data file / run id: d5_pilot_train_c4096.yaml.

### model
model_name_or_path: Qwen/Qwen3-8B
model_revision: b968826d9c46dd6066d109eabc6255188de91218
trust_remote_code: false
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset (dataset_info.json names the exact files; nothing else in the directory is ever loaded)
dataset: d5_pilot_train_c4096
eval_dataset: d5_pilot_dev_c4096
template: qwen3
enable_thinking: false
mask_history: true
train_on_prompt: false
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 2
dataloader_num_workers: 0

### output
logging_steps: 5
save_strategy: steps
save_steps: 25
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none
include_num_input_tokens_seen: non_padding

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
optim: paged_adamw_8bit
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 180000000

### eval (dev loss is recorded; it never selects the checkpoint)
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25
load_best_model_at_end: false

### d5 (read by d5pilot.train_d5, removed before LLaMA-Factory sees the config)
d5_expected_train_rows: 899
d5_expected_steps: 113
d5_candidate_steps: [75, 100, 113]
d5_run_id_suffix: c4096
